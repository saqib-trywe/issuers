[package]
name = "issuers-mcp"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
description = "A Model Context Protocol server for the Issuers tracker"

[[bin]]
name = "issuers-mcp"
path = "src/main.rs"

[dependencies]
# The library half of the tracker: the HTTP client and the domain types.
issuers = { path = "../.." }

# `server` and `macros` are on by default; `transport-io` is what gives stdio.
rmcp = { version = "3.5", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
