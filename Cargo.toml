[package]
name = "issuers"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
# Two binaries, so `cargo run` needs telling which one it means.
default-run = "Issuers"

# `issuers-mcp` is a workspace member rather than a third `[[bin]]` here, so that
# its async runtime and MCP SDK are never compiled into this package — see
# docs/adr/0009.
[workspace]
members = ["crates/issuers-mcp"]

# The shared core: domain rules, storage, the projection and the HTTP API.
# It deliberately does not contain `ui` or `app_state`, so nothing in here can
# reach back into the view — see docs/adr/0008. The name matches the package's
# own, but is written out because every `use issuers::` in `src/ui/` and
# `crates/issuers-mcp/` depends on it: renaming the package alone must not
# rename the library, and renaming the library is a change to every importer.
[lib]
name = "issuers"
path = "src/lib.rs"

# macOS titles the application menu from the process name, ignoring the name
# given to the first `Menu`. Naming the binary is what makes the menu bar read
# "Issuers" rather than the crate name — short of shipping an .app bundle.
[[bin]]
name = "Issuers"
path = "src/main.rs"

# The command-line surface. A client of the API above, not a second writer.
[[bin]]
name = "issuers-cli"
path = "src/bin/issuers-cli.rs"

[dependencies]
# gpui-component pins an exact `gpui-pre` snapshot of Zed's gpui, published to
# crates.io weekly. Depending on Zed's git `main` instead puts a second `gpui`
# in the tree whose types do not unify with the one gpui-component was built
# against, so these four move together: bump the snapshot only to the one the
# gpui-component release names in its own `Cargo.toml`.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
gpui-component = "0.7.1"
gpui-kit-assets = "0.7.1"
rust-embed = "8"
anyhow = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
directories = "6.0.0"
chrono = "0.4.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
# A local HTTP API, served on a blocking listener thread. `httparse` is the
# same parser Zed uses for its own in-process HTTP server; nothing here needs
# an async runtime. See docs/adr/0006.
httparse = "1"
getrandom = "0.4"
async-channel = "2"
# The CLI. `pico-args` was already in the lock file by way of the gpui tree,
# so it adds no compile unit; `termcolor` was too until gpui moved to the
# crates.io snapshot, and now is ours alone. `pico-args` generates no help
# text; ours is written by hand. See docs/adr/0008.
pico-args = "0.5"
termcolor = "1"
