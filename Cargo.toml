[package]
name = "issuers"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
# Two binaries, so `cargo run` needs telling which one it means.
default-run = "Issuers"

# `issuers-mcp` is a workspace member rather than a third `[[bin]]` here, so that
# its async runtime and MCP SDK are never compiled into this package — see
# docs/adr/0009.
[workspace]
members = ["crates/issuers-mcp"]

# The shared core: domain rules, storage, the projection and the HTTP API.
# It deliberately does not contain `ui` or `app_state`, so nothing in here can
# reach back into the view — see docs/adr/0008. The name matches the package's
# own, but is written out because every `use issuers::` in `src/ui/`
# depends on it, not on whatever the package is called this week.
[lib]
name = "issuers"
path = "src/lib.rs"

# macOS titles the application menu from the process name, ignoring the name
# given to the first `Menu`. Naming the binary is what makes the menu bar read
# "Issuers" rather than the crate name — short of shipping an .app bundle.
[[bin]]
name = "Issuers"
path = "src/main.rs"

# The command-line surface. A client of the API above, not a second writer.
[[bin]]
name = "issuers-cli"
path = "src/bin/issuers-cli.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
rust-embed = "8"
anyhow = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
directories = "6.0.0"
chrono = "0.4.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
# A local HTTP API, served on a blocking listener thread. `httparse` is the
# same parser Zed uses for its own in-process HTTP server; nothing here needs
# an async runtime. See docs/adr/0006.
httparse = "1"
getrandom = "0.3"
async-channel = "2"
# The CLI. Both were already in the lock file by way of the Zed tree, so
# neither adds a compile unit. `pico-args` generates no help text; ours is
# written by hand. See docs/adr/0008.
pico-args = "0.5"
termcolor = "1"
